<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        // Store the current full URL path+query+hash and bounce to the SPA shell.
        sessionStorage.setItem(
          'redirect',
          location.pathname + location.search + location.hash
        );
        location.replace('/pixcuro/');
      })();
    </script>
  </head>
  <body></body>
</html>
